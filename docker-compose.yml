volumes:
  kc_data:
    name: keycloak-data
services:
  nginx:
    image: nginx:latest
    depends_on:
      - keycloak
    ports:
      - '8080:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    develop:
      watch:
        - action: sync+restart
          path: ./nginx.conf
          target: /etc/nginx/conf.d/default.conf
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      DEBUG: 'true'
      DEBUG_PORT: '*:8787'
      KC_FEATURES: preview
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.localhost:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_ADMIN: http://keycloak-admin.localhost:8080
    ports:
      - '8787:8787'
    volumes:
      - kc_data:/opt/keycloak/data
      - ./target/twobiers.keycloak-keycloak-impersonation-action-token.jar:/opt/keycloak/providers/impersonation-action-token.jar
    develop:
      watch:
        - action: sync+restart
          path: ./target/twobiers.keycloak-keycloak-impersonation-action-token.jar
          target: /opt/keycloak/providers/impersonation-action-token.jar
